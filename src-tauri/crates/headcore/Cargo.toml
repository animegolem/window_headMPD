[package]
name = "headcore"
version = "0.1.0"
description = "Tauri-free core of the window_headMPD skin engine: hit tables, frame fan-out, skin and pref stores, guards"
edition = "2021"
publish = false

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A regular dependency, not a dev one: the stores write to a temp file and rename it into place.
tempfile = "3"
